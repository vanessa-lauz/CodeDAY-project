<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conecta Voluntário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Conecta Voluntário</h1>

    <p class="subtitulo">
        Encontre uma forma de ajudar de acordo com seus interesses.
    </p>

    <label for="texto">
        Como você gostaria de ajudar?
    </label>

    <textarea
            id="texto"
            placeholder="Ex.: Tenho ração para doar e gosto de animais..."
    ></textarea>

    <button id="botao">
        Encontrar onde ajudar
    </button>

    <p id="status"></p>

    <section id="resultado" class="resultado"></section>

</main>

<script src="script.js"></script>

</body>
</html>
